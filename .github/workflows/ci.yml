name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      PYTEST_ADDOPTS: "-n 1"
      PYTHONPATH: ${{ github.workspace }}
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.10', '3.11', '3.12']
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: 'pip'
          cache-dependency-path: |
            requirements.txt
            requirements-test.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
          pip install -r requirements-test.txt

      - name: Static checks (ruff)
        run: ruff check . || true

      - name: "CI debug: repo layout and test discovery"
        run: |
          echo "::group::Tree"
          ls -la
          echo
          git ls-tree -r --name-only HEAD | sed -n '1,400p'
          echo "::endgroup::"
          echo "::group::Find tests dir"
          find . -maxdepth 3 -type d -name tests -print || true
          echo "::endgroup::"
          echo "::group::Pytest collection"
          pytest --collect-only -q || true
          echo "::endgroup::"

      - name: "Sanity: import app & models"
        run: |
          python - <<'PY'
          import importlib, sys, os, pathlib, importlib.util
          def import_by_filename(modname, filename):
              root = pathlib.Path(".").resolve()
              matches = list(root.rglob(filename))
              if not matches:
                  raise ImportError(f"Cannot find {filename}")
              path = str(matches[0])
              spec = importlib.util.spec_from_file_location(modname, path)
              mod = importlib.util.module_from_spec(spec)
              spec.loader.exec_module(mod)  # type: ignore
              sys.modules[modname] = mod
              return mod
          try:
              importlib.import_module("models")
          except Exception:
              import_by_filename("models", "models.py")
          try:
              app_mod = importlib.import_module("app")
          except Exception:
              app_mod = import_by_filename("app", "app.py")
          print(f"[OK] models: {sys.modules['models'].__file__}")
          print(f"[OK] app: {app_mod.__file__}")
          PY

      - name: Run tests (pytest)
        run: pytest

      - name: Enforce coverage threshold (80% global)
        if: matrix.python-version == '3.11'
        run: |
          python - <<'PY'
          import xml.etree.ElementTree as ET
          tree = ET.parse('coverage.xml')
          total = tree.getroot().attrib.get('line-rate', None)
          if total is None:
              raise SystemExit("coverage.xml missing line-rate")
          pct = float(total) * 100
          print(f"Total coverage: {pct:.2f}%")
          if pct < 80.0:
              raise SystemExit(f"Coverage {pct:.2f}% is below required 80%")
          PY

      - name: Upload test artifacts
        uses: actions/upload-artifact@v4
        with:
          name: test-and-coverage-${{ matrix.python-version }}
          path: |
            coverage.xml
            .coverage
            test-results/
          if-no-files-found: ignore

  benchmark:
    needs: test
    runs-on: ubuntu-latest
    env:
      PYTHONPATH: ${{ github.workspace }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: |
            requirements.txt
            requirements-test.txt
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
          pip install -r requirements-test.txt
      - name: Run lightweight performance checks
        run: |
          python perf/profile_checkout.py || true
          python perf/profile_catalog.py || true
      - name: Upload profiling artifacts
        uses: actions/upload-artifact@v4
        with:
          name: profiling
          path: perf_artifacts
          if-no-files-found: ignore
