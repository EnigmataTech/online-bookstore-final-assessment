name: CI
on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      PYTEST_ADDOPTS: "-n 1"
      PYTHONPATH: ${{ github.workspace }}
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.10', '3.11', '3.12']
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: 'pip'
          cache-dependency-path: |
            requirements.txt
            requirements-test.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
          pip install -r requirements-test.txt

      - name: "Sanity: import models then app"
        run: python .github/scripts/import_preflight.py

      - name: Run tests (pytest)
        run: pytest

      - name: Enforce coverage threshold (20% global TEMP)
        if: matrix.python-version == '3.11'
        run: |
          python - <<'PY'
          import xml.etree.ElementTree as ET
          tree = ET.parse('coverage.xml')
          total = tree.getroot().attrib.get('line-rate', None)
          if total is None:
              raise SystemExit("coverage.xml missing line-rate")
          pct = float(total) * 100
          print(f"Total coverage: {pct:.2f}%")
          if pct < 20.0:
              raise SystemExit(f"Coverage {pct:.2f}% is below temporary floor 20%")
          PY

      - name: Upload test artifacts
        uses: actions/upload-artifact@v4
        with:
          name: test-and-coverage-${{ matrix.python-version }}
          path: |
            coverage.xml
            .coverage
            test-results/
          if-no-files-found: ignore
