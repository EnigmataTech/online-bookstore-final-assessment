name: CI
on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      PYTEST_ADDOPTS: "-n 1"
      PYTHONPATH: ${{ github.workspace }}
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.10', '3.11', '3.12']
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: 'pip'
          cache-dependency-path: |
            requirements.txt
            requirements-test.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
          pip install -r requirements-test.txt

      - name: "Sanity: import models then app"
        run: |
          python - <<'PY'
          import importlib, importlib.util, sys, pathlib

          def import_by_filename(modname, filename):
              root = pathlib.Path(".").resolve()
              path = next(root.rglob(filename), None)
              if path is None:
                  raise SystemExit(f"Cannot find {filename}")
              spec = importlib.util.spec_from_file_location(modname, str(path))
              mod = importlib.util.module_f_
